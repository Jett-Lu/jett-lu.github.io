name: Site Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        run: npx --yes htmlhint@1.6.3 index.html --config .htmlhintrc

      - name: Validate CSS
        run: npx --yes stylelint@16.24.0 styles.css --config .stylelintrc.json

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check scripts/projects.js
